<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" width="1120" height="780" font-family="'IBM Plex Sans','Segoe UI',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a92a0"/></marker>
</defs>
<rect width="1120" height="780" fill="#f3f4f6"/>
<text x="560.0" y="48" text-anchor="middle" font-family="'IBM Plex Mono',Consolas,monospace" font-weight="600" font-size="24" fill="#14171c">The AI stack, top to bottom</text>
<text x="560.0" y="76" text-anchor="middle" font-size="14" fill="#5b6472">Each layer only works because the one below it exists</text>

<line x1="52" y1="136" x2="52" y2="706" stroke="#8a92a0" stroke-width="1.5" marker-end="url(#ar)"/>
<text transform="translate(34,421.0) rotate(-90)" text-anchor="middle" font-size="12" fill="#8a92a0" font-family="'IBM Plex Mono',Consolas,monospace">CLOSER TO THE USER  →  CLOSER TO THE SILICON</text>
<rect x="110" y="130" width="610" height="64" rx="3" fill="#ffffff"/>
<rect x="110" y="130" width="610" height="64" rx="3" fill="#0068b31a" stroke="#0068b3" stroke-width="1.2"/>
<text x="128" y="169" font-family="'IBM Plex Mono',Consolas,monospace" font-weight="600" font-size="22" fill="#0068b3">1</text>
<text x="162" y="157" font-family="'IBM Plex Mono',Consolas,monospace" font-weight="600" font-size="15" fill="#14171c">Application</text>
<text x="162" y="178" font-size="12.5" fill="#5b6472">What people touch: chat, coding assistant, support bot</text>
<rect x="110" y="204" width="610" height="64" rx="3" fill="#ffffff"/>
<rect x="110" y="204" width="610" height="64" rx="3" fill="#0068b31a" stroke="#0068b3" stroke-width="1.2"/>
<text x="128" y="243" font-family="'IBM Plex Mono',Consolas,monospace" font-weight="600" font-size="22" fill="#0068b3">2</text>
<text x="162" y="231" font-family="'IBM Plex Mono',Consolas,monospace" font-weight="600" font-size="15" fill="#14171c">Orchestration & agents</text>
<text x="162" y="252" font-size="12.5" fill="#5b6472">Plans steps, calls tools, loops until done</text>
<rect x="110" y="278" width="610" height="64" rx="3" fill="#ffffff"/>
<rect x="110" y="278" width="610" height="64" rx="3" fill="#0068b31a" stroke="#0068b3" stroke-width="1.2"/>
<text x="128" y="317" font-family="'IBM Plex Mono',Consolas,monospace" font-weight="600" font-size="22" fill="#0068b3">3</text>
<text x="162" y="305" font-family="'IBM Plex Mono',Consolas,monospace" font-weight="600" font-size="15" fill="#14171c">Model</text>
<text x="162" y="326" font-size="12.5" fill="#5b6472">Weights + architecture; predicts the next token</text>
<rect x="110" y="352" width="610" height="64" rx="3" fill="#ffffff"/>
<rect x="110" y="352" width="610" height="64" rx="3" fill="#0068b31a" stroke="#0068b3" stroke-width="1.2"/>
<text x="128" y="391" font-family="'IBM Plex Mono',Consolas,monospace" font-weight="600" font-size="22" fill="#0068b3">4</text>
<text x="162" y="379" font-family="'IBM Plex Mono',Consolas,monospace" font-weight="600" font-size="15" fill="#14171c">Inference serving</text>
<text x="162" y="400" font-size="12.5" fill="#5b6472">Batches users together, manages the KV cache</text>
<rect x="110" y="426" width="610" height="64" rx="3" fill="#ffffff"/>
<rect x="110" y="426" width="610" height="64" rx="3" fill="#0068b31a" stroke="#0068b3" stroke-width="1.2"/>
<text x="128" y="465" font-family="'IBM Plex Mono',Consolas,monospace" font-weight="600" font-size="22" fill="#0068b3">5</text>
<text x="162" y="453" font-family="'IBM Plex Mono',Consolas,monospace" font-weight="600" font-size="15" fill="#14171c">Frameworks & drivers</text>
<text x="162" y="474" font-size="12.5" fill="#5b6472">Turns matrix math into chip instructions</text>
<rect x="110" y="500" width="610" height="64" rx="3" fill="#ffffff"/>
<rect x="110" y="500" width="610" height="64" rx="3" fill="#a8551f1a" stroke="#a8551f" stroke-width="1.2"/>
<text x="128" y="539" font-family="'IBM Plex Mono',Consolas,monospace" font-weight="600" font-size="22" fill="#a8551f">6</text>
<text x="162" y="527" font-family="'IBM Plex Mono',Consolas,monospace" font-weight="600" font-size="15" fill="#14171c">Memory</text>
<text x="162" y="548" font-size="12.5" fill="#5b6472">HBM beside the GPU, DRAM, then SSD. Sets the speed limit</text>
<rect x="110" y="574" width="610" height="64" rx="3" fill="#ffffff"/>
<rect x="110" y="574" width="610" height="64" rx="3" fill="#a8551f1a" stroke="#a8551f" stroke-width="1.2"/>
<text x="128" y="613" font-family="'IBM Plex Mono',Consolas,monospace" font-weight="600" font-size="22" fill="#a8551f">7</text>
<text x="162" y="601" font-family="'IBM Plex Mono',Consolas,monospace" font-weight="600" font-size="15" fill="#14171c">CPU</text>
<text x="162" y="622" font-size="12.5" fill="#5b6472">The manager: OS, networking, feeding the GPUs</text>
<rect x="110" y="648" width="610" height="64" rx="3" fill="#ffffff"/>
<rect x="110" y="648" width="610" height="64" rx="3" fill="#a8551f1a" stroke="#a8551f" stroke-width="1.2"/>
<text x="128" y="687" font-family="'IBM Plex Mono',Consolas,monospace" font-weight="600" font-size="22" fill="#a8551f">8</text>
<text x="162" y="675" font-family="'IBM Plex Mono',Consolas,monospace" font-weight="600" font-size="15" fill="#14171c">GPU / accelerator</text>
<text x="162" y="696" font-size="12.5" fill="#5b6472">Does the matrix multiplication, thousands at once</text>
<text x="736" y="118" font-size="11" fill="#8a92a0" font-family="IBM Plex Mono,Consolas,monospace" letter-spacing="1">EXAMPLES</text>
<text x="736" y="166.0" font-size="13" fill="#5b6472">ChatGPT · Claude · Copilot · Cursor</text>
<text x="736" y="240.0" font-size="13" fill="#5b6472">MCP · LangGraph · agent platforms</text>
<text x="736" y="314.0" font-size="13" fill="#5b6472">GPT · Claude · Gemini · Llama</text>
<text x="736" y="388.0" font-size="13" fill="#5b6472">vLLM · TensorRT-LLM · SGLang</text>
<text x="736" y="462.0" font-size="13" fill="#5b6472">PyTorch · JAX · CUDA · XLA</text>
<text x="736" y="536.0" font-size="13" fill="#5b6472">SK hynix · Samsung · Micron</text>
<text x="736" y="610.0" font-size="13" fill="#5b6472">Intel · AMD · Nvidia Grace/Vera</text>
<text x="736" y="684.0" font-size="13" fill="#5b6472">Nvidia · AMD · Google TPU</text>
<line x1="110" y1="495.0" x2="720" y2="495.0" stroke="#14171c" stroke-width="1" stroke-dasharray="4 4"/>
<text x="736" y="499.0" font-size="11" fill="#14171c" font-family="IBM Plex Mono,Consolas,monospace" letter-spacing="1">SOFTWARE ABOVE · HARDWARE BELOW</text>
<text x="560.0" y="752" text-anchor="middle" font-size="13" fill="#5b6472">Decode (one token at a time) is limited by how fast layer 6 can feed layer 8, not by how fast layer 8 can calculate.</text>
</svg>