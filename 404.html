<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found — AI, As I Go</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f3f4f6; --ink:#14171c; --ink-dim:#5b6472; --accent:#0068b3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0a0c10; --ink:#e7ebf0; --ink-dim:#8b93a3; --accent:#5fc2ff; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans", system-ui, sans-serif; padding:24px; }
  .box { max-width:420px; }
  .code { font-family:"IBM Plex Mono", monospace; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin:0 0 14px; }
  h1 { font-family:"IBM Plex Mono", monospace; font-weight:600; font-size:28px; margin:0 0 12px; }
  p { color:var(--ink-dim); margin:0 0 20px; }
  a { color:var(--accent); font-family:"IBM Plex Mono", monospace; font-size:13px; }
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>That page doesn't exist, or it moved.</p>
    <a href="/">&larr; Home</a>
  </div>
</body>
</html>
