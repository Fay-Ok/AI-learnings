<style>
  :root {
    --bg: #f3f4f6;
    --surface: #ffffff;
    --surface-2: #eaecf0;
    --ink: #14171c;
    --ink-dim: #5b6472;
    --ink-faint: #8a92a0;
    --accent: #0068b3;
    --accent-soft: #0068b31a;
    --copper: #a8551f;
    --copper-soft: #a8551f1a;
    --line: #d7dae0;
    --line-strong: #b8bdc7;
    --radius: 3px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0c10;
      --surface: #12151b;
      --surface-2: #1a1e26;
      --ink: #e7ebf0;
      --ink-dim: #8b93a3;
      --ink-faint: #5c6472;
      --accent: #5fc2ff;
      --accent-soft: #5fc2ff22;
      --copper: #f0a35f;
      --copper-soft: #f0a35f22;
      --line: #262b34;
      --line-strong: #343b47;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0a0c10;
    --surface: #12151b;
    --surface-2: #1a1e26;
    --ink: #e7ebf0;
    --ink-dim: #8b93a3;
    --ink-faint: #5c6472;
    --accent: #5fc2ff;
    --accent-soft: #5fc2ff22;
    --copper: #f0a35f;
    --copper-soft: #f0a35f22;
    --line: #262b34;
    --line-strong: #343b47;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .nf { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
  .box { max-width: 420px; }
  .code { font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 14px; }
  h1 { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 28px; margin: 0 0 12px; }
  .box p { color: var(--ink-dim); margin: 0 0 20px; }
  .box a { font-family: "IBM Plex Mono", monospace; font-size: 13px; }
</style>
<!-- site-shell -->
<style>
  /* Shared site shell: full-width header band with tabs + research sub-tabs. Identical on every page. */
  .shell { max-width: 1200px; margin: 0 auto; padding-left: clamp(16px, 4vw, 48px); padding-right: clamp(16px, 4vw, 48px); }
  .site-top { background: var(--surface); border-bottom: 1px solid var(--line); }
  .site-top-in { display: flex; align-items: stretch; justify-content: space-between; gap: 16px; min-height: 60px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 600; font-size: 15px; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; white-space: nowrap; }
  .brand svg { width: 20px; height: 20px; flex: none; color: var(--accent); }
  .brand:hover { color: var(--accent); }
  .tabs { display: flex; align-items: stretch; gap: 4px; }
  .tab { display: flex; align-items: center; padding: 0 14px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; font-weight: 500; color: var(--ink-dim); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; transition: color 0.12s ease, border-color 0.12s ease; }
  .tab:hover { color: var(--ink); border-bottom-color: var(--line-strong, var(--line)); }
  .tab.is-active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:focus-visible, .brand:focus-visible, .subtab:focus-visible, .crumb:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .subnav { border-bottom: 1px solid var(--line); }
  .subnav-in { display: flex; align-items: center; gap: 10px; min-height: 46px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; overflow-x: auto; }
  .crumb { color: var(--ink-faint); text-decoration: none; letter-spacing: 0.1em; text-transform: uppercase; font-size: 11px; white-space: nowrap; }
  .crumb:hover { color: var(--accent); }
  .crumb-sep { color: var(--ink-faint); }
  .subtabs { display: flex; gap: 6px; }
  .subtab { padding: 3px 11px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink-dim); text-decoration: none; white-space: nowrap; }
  .subtab:hover { color: var(--ink); border-color: var(--ink-faint); }
  .subtab.is-active { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }
  @media (max-width: 480px) {
    .site-top-in { gap: 8px; min-height: 54px; }
    .brand { font-size: 14px; gap: 8px; }
    .brand svg { width: 18px; height: 18px; }
    .tab { padding: 0 9px; font-size: 12.5px; }
  }
</style>
